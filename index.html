<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f7fb" />
    <meta
      name="description"
      content="A little less scrolling. A little more cinema. Discover your next favorite on PrimeTV."
    />
    <title>PrimeTV — Find your next favorite</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%23734ce2'/%3E%3Cpath d='M25 17v30l23-15z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to titles</a>
    <header class="header">
      <a class="brand" href="#home" aria-label="PrimeTV home"
        ><span class="brand-mark" aria-hidden="true">▶</span>prime<span>tv</span
        ><span class="brand-dot">.</span></a
      >
      <nav aria-label="Main navigation">
        <button class="nav-link active" data-page="home" aria-current="page">
          Home</button
        ><button class="nav-link" data-page="movie">Movies</button
        ><button class="nav-link" data-page="tv">TV shows</button
        ><button class="nav-link" data-page="list">My list</button>
      </nav>
      <div class="header-actions">
        <button
          class="icon-button"
          id="search-toggle"
          aria-label="Search"
        ></button
        ><span class="header-divider"></span
        ><button class="account-button" id="account-button">
          Sign in <span class="avatar mini" aria-hidden="true">P</span>
        </button>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <section class="search-bar" id="search-bar" hidden>
        <label for="search-input">Find something good.</label>
        <div class="search-field">
          <input
            type="search"
            id="search-input"
            placeholder="Movies, shows, a new obsession…"
            autocomplete="off"
          /><button
            class="icon-button"
            id="search-close"
            aria-label="Close search"
          >
            ×
          </button>
        </div>
      </section>
      <div id="page-content" aria-live="polite">
        <div class="loading-page">
          <span class="spinner"></span>Finding your next favorite…
        </div>
      </div>
    </main>
    <footer>
      <a class="brand small" href="#home"
        >prime<span>tv</span><span class="brand-dot">.</span></a
      >
      <p>Your next favorite is out there.</p>
      <a
        href="https://www.themoviedb.org"
        target="_blank"
        rel="noopener noreferrer"
        >Metadata by TMDB</a
      ><small
        >This product uses the TMDB API but is not endorsed or certified by
        TMDB.</small
      >
    </footer>
    <dialog
      id="details-dialog"
      class="details-dialog"
      aria-label="Title details"
    ></dialog>
    <dialog
      id="auth-dialog"
      class="auth-dialog"
      aria-labelledby="auth-title"
    ></dialog>
    <dialog
      id="profiles-dialog"
      class="profiles-dialog"
      aria-labelledby="profiles-title"
    ></dialog>
    <dialog
      id="player-dialog"
      class="player-dialog"
      aria-label="Video player"
    ></dialog>
    <div
      class="toast-region"
      id="toasts"
      role="status"
      aria-live="polite"
    ></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
